{% set giscus = config.extra.giscus %}
<div id="__comments_script"></div>
<script>
  var comments = document.createElement("script");
  var commentsTheme = document.body.dataset.mdColorScheme === "slate" ? "dark" : "light";
  var configuredTheme = {{ (giscus.theme or '') | tojson }};
  var configuredLang = {{ (giscus.lang or '') | tojson }};
  Object.entries({
    async: true,
    src: {{ (giscus.src or 'https://giscus.app/client.js') | tojson }},
    crossOrigin: "anonymous",
    "data-repo": {{ giscus.repo | tojson }},
    "data-repo-id": {{ giscus.repo_id | tojson }},
    "data-category": {{ (giscus.category or (config.theme.language == 'zh' and '评论' or 'Comments')) | tojson }},
    "data-category-id": {{ giscus.category_id | tojson }},
    "data-mapping": {{ (giscus.mapping or 'pathname') | tojson }},
    "data-strict": {{ (giscus.strict or '1') | tojson }},
    "data-reactions-enabled": {{ (giscus.reactions_enabled or '1') | tojson }},
    "data-emit-metadata": {{ (giscus.emit_metadata or '0') | tojson }},
    "data-input-position": {{ (giscus.input_position or 'top') | tojson }},
    "data-theme": configuredTheme || commentsTheme,
    "data-lang": configuredLang || {{ ((config.theme.language == 'zh') and 'zh-CN' or 'en-US') | tojson }},
    "data-loading": {{ (giscus.loading or 'lazy') | tojson }}
  }).forEach(function(entry) { comments.setAttribute(entry[0], entry[1]); });
  document.getElementById("__comments_script").replaceWith(comments);
</script>
