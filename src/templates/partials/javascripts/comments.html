{% set giscus = config.extra.giscus %}
<div id="__comments_script"></div>
<script>
  (function() {
    var lightTheme = {{ (giscus.light_theme or 'light') | tojson }};
    var darkTheme = {{ (giscus.dark_theme or 'dark') | tojson }};
    var configuredTheme = {{ (giscus.theme or '') | tojson }};

    function getGiscusTheme() {
      if (configuredTheme && configuredTheme !== "preferred_color_scheme") {
        return configuredTheme;
      }
      var scheme = document.body.getAttribute("data-md-color-scheme");
      if (!scheme) {
        try {
          var palette = __md_get("__palette");
          if (palette && palette.color && palette.color.scheme) {
            scheme = palette.color.scheme;
          }
        } catch (e) {}
      }
      if (scheme === "slate") return darkTheme;
      if (scheme === "default") return lightTheme;
      var isDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      return isDark ? darkTheme : lightTheme;
    }

    function syncGiscusTheme() {
      var theme = getGiscusTheme();
      var frame = document.querySelector("iframe.giscus-frame");
      if (frame && frame.contentWindow) {
        frame.contentWindow.postMessage(
          { giscus: { setConfig: { theme: theme } } },
          "https://giscus.app"
        );
      }
    }

    var comments = document.createElement("script");
    var configuredLang = {{ (giscus.lang or '') | tojson }};
    Object.entries({
      async: true,
      src: {{ (giscus.src or 'https://giscus.app/client.js') | tojson }},
      crossOrigin: "anonymous",
      "data-repo": {{ giscus.repo | tojson }},
      "data-repo-id": {{ giscus.repo_id | tojson }},
      "data-category": {{ (giscus.category or (config.theme.language == 'zh' and '评论' or 'Comments')) | tojson }},
      "data-category-id": {{ giscus.category_id | tojson }},
      "data-mapping": {{ (giscus.mapping or 'pathname') | tojson }},
      "data-strict": {{ (giscus.strict or '1') | tojson }},
      "data-reactions-enabled": {{ (giscus.reactions_enabled or '1') | tojson }},
      "data-emit-metadata": {{ (giscus.emit_metadata or '0') | tojson }},
      "data-input-position": {{ (giscus.input_position or 'top') | tojson }},
      "data-theme": getGiscusTheme(),
      "data-lang": configuredLang || {{ ((config.theme.language == 'zh') and 'zh-CN' or 'en-US') | tojson }},
      "data-loading": {{ (giscus.loading or 'lazy') | tojson }}
    }).forEach(function(entry) { comments.setAttribute(entry[0], entry[1]); });

    var scriptAnchor = document.getElementById("__comments_script");
    if (scriptAnchor) {
      scriptAnchor.replaceWith(comments);
    }

    if (!window.__plwGiscusSyncInitialized) {
      window.__plwGiscusSyncInitialized = true;

      // 监听 Giscus 握手消息，加载完成后再次核对主题
      window.addEventListener("message", function(event) {
        if (event.origin !== "https://giscus.app") return;
        if (typeof event.data === "object" && event.data && "giscus" in event.data) {
          syncGiscusTheme();
        }
      });

      // 监听站点主题属性变化
      if (window.MutationObserver) {
        var observer = new MutationObserver(function(mutations) {
          for (var i = 0; i < mutations.length; i++) {
            if (mutations[i].type === "attributes" && mutations[i].attributeName === "data-md-color-scheme") {
              syncGiscusTheme();
              break;
            }
          }
        });
        observer.observe(document.body, { attributes: true, attributeFilter: ["data-md-color-scheme"] });
      }

      // 跟随系统主题时的动态响应
      if (window.matchMedia) {
        var mediaQuery = window.matchMedia("(prefers-color-scheme: dark)");
        var handleMediaChange = function() {
          syncGiscusTheme();
        };
        if (mediaQuery.addEventListener) {
          mediaQuery.addEventListener("change", handleMediaChange);
        } else if (mediaQuery.addListener) {
          mediaQuery.addListener(handleMediaChange);
        }
      }
    }
  })();
</script>
